<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Banner Sonntag geöffnet – Variante 2 – 200 × 40 cm</title>
<style>
  @font-face {
    font-family: 'Inter Black';
    src: url('fonts/Inter-Black.otf') format('opentype');
    font-weight: 900;
    font-display: block;
  }

  :root {
    --bleed: 0mm;
    --gelb: #FFE500;
    --rot: #E30613;
    --dunkelrot: #9B0410;
    --schwarz: #111111;
  }

  @page { size: calc(2000mm + 2 * var(--bleed) + 1mm) calc(400mm + 2 * var(--bleed) + 1mm); margin: 0; }
  html, body { margin: 0; padding: 0; overflow: hidden; }
  html { background: var(--gelb); }
  body {
    width: calc(2000mm + 2 * var(--bleed));
    height: calc(400mm + 2 * var(--bleed));
    overflow: hidden;
    position: relative;
    background: var(--gelb);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    font-family: 'Inter Black', 'Inter', Arial, sans-serif;
    font-weight: 900;
  }

  .banner {
    position: absolute;
    left: var(--bleed); top: var(--bleed);
    width: 2000mm; height: 400mm;
  }

  /* Logo auf weißem "Sticker" mit rotem Rand und hartem Schlagschatten */
  .logo {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 400mm;
    padding: 22mm 26mm;
    box-sizing: border-box;
    background: #fff;
    border: 5mm solid var(--rot);
    border-radius: 14mm;
    box-shadow: 6mm 6mm 0 var(--dunkelrot);
  }
  .logo.left  { left: 50mm; }
  .logo.right { right: 50mm; }
  .logo svg { width: 100%; height: auto; display: block; }

  /* Überschrift: rot mit weißer Kontur und dunkelroter 3D-Kante */
  .headline {
    position: absolute;
    left: 0; right: 0; top: 14mm;
    text-align: center;
    font-size: 146mm;
    line-height: 0.95;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .headline .layer {
    position: absolute; left: 0; right: 0; top: 0;
  }
  .headline .shadow { color: var(--dunkelrot); transform: translate(5mm, 5mm); }
  .headline .front {
    color: var(--rot);
    -webkit-text-stroke: 4mm #fff;
    paint-order: stroke fill;
  }

  /* roter Balken mit dunkelroter Unterkante */
  .bar {
    position: absolute;
    left: calc(-1 * var(--bleed)); right: calc(-1 * var(--bleed)); top: 334mm;
    height: 12mm;
    margin-top: -6mm;
    background: var(--rot);
    border-bottom: 4mm solid var(--dunkelrot);
  }

  /* Uhrzeit als abgerundeter Button mit weißer Kontur und Schatten */
  .time {
    position: absolute;
    left: 50%; top: 334mm;
    transform: translate(-50%, -50%);
    background: var(--rot);
    color: #fff;
    font-size: 66mm;
    line-height: 1;
    padding: 12mm 56mm 15mm;
    white-space: nowrap;
    border: 5mm solid #fff;
    border-radius: 60mm;
    box-shadow: 6mm 6mm 0 var(--dunkelrot);
  }

  @media screen {
    html { background: #333 !important; }
    body { zoom: 0.18; margin: 40px auto; }
  }
</style>
</head>
